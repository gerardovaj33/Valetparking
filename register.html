<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear Cuenta</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="register-contenedor">

        <div class="register-card">

            <h1 class="register-titulo">

                CREACIÓN DE CUENTA

            </h1>

            <input type="text" class="register-input" placeholder="Nombre">

            <input type="text" class="register-input" placeholder="Apellidos">

            <input type="tel" class="register-input" placeholder="Teléfono">

            <input type="email" class="register-input" placeholder="Correo">

            <input type="password" class="register-input" placeholder="Contraseña">

            <label class="file-label">

                Subir licencia de conducir

            </label>

            <input type="file" class="register-file">

            <a href="login.html" class="btn-register">

                SIGUIENTE

            </a>

        </div>

    </div>

</body>

</html>
